<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style type="text/css"><![CDATA[
      .label { font: 16px Arial, Helvetica, sans-serif; fill: #f8f8f8; stroke: none; }
      .poi { font: 14px Arial, Helvetica, sans-serif; fill: #fff; }
      .contour { fill-opacity: 0.9; stroke: #002; stroke-width: 1.5; }
      .shelf { fill: #86d3ff; }
      .mid { fill: #3fa9f5; }
      .abyss { fill: #052a4f; }
      .pf-heat { fill: rgba(255,140,0,0.18); }
      /* Increased visibility for design review */
      .faction-bathy { fill: rgba(255,102,0,0.28); stroke: #ff6600; }
      .faction-pelagia { fill: rgba(34,204,119,0.20); stroke: #22cc77; }
      .faction-abyssal { fill: rgba(138,43,226,0.18); stroke: #8a2be2; }
      .faction-hadron { fill: rgba(255,215,0,0.20); stroke: #ffd700; }
      .label-small { font-size:12px; fill:#e8f6ff; }
    ]]></style>
  </defs>

  <!-- background -->
  <rect width="1200" height="800" fill="#041726" />

  <!-- Depth bands as broad ovals/contours -->
  <ellipse cx="600" cy="240" rx="520" ry="160" class="contour shelf" />
  <ellipse cx="600" cy="360" rx="640" ry="240" class="contour mid" />
  <ellipse cx="600" cy="520" rx="760" ry="360" class="contour abyss" />

  <!-- Faction territory overlays (approximate influence areas) -->
  <!-- Bathyarch Consortium (loud, territorial) -->
  <path d="M230 110 C 390 150, 450 250, 410 350 C 530 390, 630 450, 750 470 C 790 410, 730 250, 650 210 C 570 170, 450 150, 330 120 Z" class="faction-bathy" stroke-opacity="0.6"/>
  <text x="500" y="180" class="label-small">Bathyarch Consortium</text>

  <!-- Pelagia Commune (stealth, coastal shelf) -->
  <path d="M40 160 C 160 160, 240 180, 340 220 C 300 280, 240 320, 180 340 C 100 320, 60 240, 40 180 Z" class="faction-pelagia" stroke-opacity="0.6"/>
  <text x="110" y="220" class="label-small">Pelagia Commune</text>

  <!-- Abyssal Directorate (deep, centralized) -->
  <path d="M670 380 C 740 440, 840 500, 980 560 C 980 620, 800 700, 680 740 C 600 680, 620 600, 660 540 C 680 500, 700 460, 720 420 Z" class="faction-abyssal" stroke-opacity="0.6"/>
  <text x="820" y="560" class="label-small">Abyssal Directorate</text>

  <!-- Hadron Knights (positional, spired) -->
  <path d="M760 60 C 860 100, 920 160, 980 200 C 1020 180, 1040 240, 1020 280 C 960 300, 900 280, 860 240 C 820 200, 780 140, 760 100 Z" class="faction-hadron" stroke-opacity="0.6"/>
  <text x="880" y="160" class="label-small">Hadron Knights</text>

  <!-- Depth labels -->
  <text x="980" y="170" class="label">Shelf (0–400m)</text>
  <text x="980" y="320" class="label">Mid-Water (400–1,800m)</text>
  <text x="980" y="540" class="label">Abyssal (1,800+m)</text>

  <!-- POIs: The Mouth -->
  <g id="poi-mouth">
    <path d="M150 120 C 240 180, 320 160, 420 200" stroke="#ffdd55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="135" cy="110" r="8" fill="#ffdd55"/>
    <text x="150" y="100" class="poi">The Mouth</text>
    <text x="150" y="118" class="poi" font-size="12">Strategic funnel</text>
  </g>

  <!-- Pelagion Rift -->
  <g id="pelagion-rift">
    <ellipse cx="420" cy="380" rx="70" ry="40" fill="#ff7fbf" opacity="0.9" stroke="#5a0033" stroke-width="1"/>
    <text x="400" y="370" class="poi">Pelagion Rift</text>
    <text x="400" y="388" class="poi" font-size="12">Resource upwellings</text>
  </g>

  <!-- Resonance Crystal Fields -->
  <g id="resonance-fields">
    <rect x="740" y="500" width="160" height="120" rx="12" ry="12" fill="#9a7cff" opacity="0.95" stroke="#2b1450" stroke-width="1"/>
    <text x="760" y="530" class="poi">Resonance Crystal Fields</text>
    <text x="760" y="548" class="poi" font-size="12">Primary match objectives</text>
  </g>

  <!-- Thermal Vent Clusters (cluster of small circles) -->
  <g id="thermal-vents" fill="#ff8c42">
    <circle cx="900" cy="240" r="6"/>
    <circle cx="920" cy="260" r="5"/>
    <circle cx="885" cy="270" r="5"/>
    <text x="900" y="220" class="poi">Thermal Vent Cluster</text>
  </g>

  <!-- Trench Axis (long curve) -->
  <g id="trench-axis">
    <path d="M80 600 C 260 540, 420 520, 600 560 C 780 600, 940 620, 1120 560" stroke="#66ffcc" stroke-width="3" fill="none" stroke-dasharray="6 8"/>
    <text x="560" y="620" class="poi">Trench Axis — listening corridor</text>
  </g>

  <!-- PF heat example overlay near trench -->
  <ellipse cx="700" cy="420" rx="140" ry="80" class="pf-heat" />
  <text x="640" y="420" class="poi">High PF (trench)</text>

  <!-- Legend box -->
  <g transform="translate(20,620)">
    <rect width="360" height="150" rx="8" ry="8" fill="#001826" stroke="#0b3b4d"/>
    <text x="16" y="642" class="label">Legend</text>
    <rect x="16" y="662" width="18" height="12" fill="#86d3ff" stroke="#002"/>
    <text x="42" y="674" class="poi">Shelf (low depth)</text>
    <rect x="16" y="682" width="18" height="12" fill="#3fa9f5" stroke="#002"/>
    <text x="42" y="694" class="poi">Mid-Water</text>
    <rect x="16" y="702" width="18" height="12" fill="#052a4f" stroke="#002"/>
    <text x="42" y="714" class="poi">Abyssal (high value)</text>

    <!-- Faction legend entries -->
    <rect x="200" y="662" width="18" height="12" fill="rgba(255,102,0,0.28)" stroke="#ff6600"/>
    <text x="224" y="674" class="poi">Bathyarch Consortium</text>
    <rect x="200" y="682" width="18" height="12" fill="rgba(34,204,119,0.20)" stroke="#22cc77"/>
    <text x="224" y="694" class="poi">Pelagia Commune</text>
    <rect x="200" y="702" width="18" height="12" fill="rgba(138,43,226,0.18)" stroke="#8a2be2"/>
    <text x="224" y="714" class="poi">Abyssal Directorate</text>
    <rect x="200" y="722" width="18" height="12" fill="rgba(255,215,0,0.20)" stroke="#ffd700"/>
    <text x="224" y="734" class="poi">Hadron Knights</text>
  </g>

  <!-- Title -->
  <text x="40" y="40" font-family="Arial" font-size="20" fill="#ffffff">World Map Sketch — Echoes of the Abyss (faction overlays)</text>

</svg>