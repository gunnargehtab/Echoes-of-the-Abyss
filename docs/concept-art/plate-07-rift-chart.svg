    <text x="1886" y="1210" class="rail" transform="rotate(90 1886 1210)" text-anchor="middle" letter-spacing="6">NORTH-SHALLOW &#8594; SOUTH-DEEP &#183; STATUS RUNS DOWNWARD</text>
  </g>

  <!-- ===== scale + legend ===== -->
  <g>
    <g class="hairline" stroke-opacity="0.5">
      <line x1="240" y1="2410" x2="440" y2="2410"/>
      <line x1="240" y1="2404" x2="240" y2="2416"/><line x1="340" y1="2406" x2="340" y2="2414"/><line x1="440" y1="2404" x2="440" y2="2416"/>
    </g>
    <text x="240" y="2444" class="num">0</text>
    <text x="440" y="2444" class="num" text-anchor="end">20 km</text>
    <text x="240" y="2472" class="lbl2">NINETY KILOMETRES END TO END &#183; ONE VALLEY &#183; ONE CIVILISATION</text>

    <g transform="translate(240,2120)">
      <circle cx="8" cy="-6" r="4" class="teal"/><text x="26" y="0" class="num">PELAGIA COMMUNE</text>
      <circle cx="8" cy="26" r="4" class="amber"/><text x="26" y="32" class="num">BATHYARCH CONSORTIUM</text>
      <circle cx="8" cy="58" r="4" class="violet"/><text x="26" y="64" class="num">HADRON KNIGHTS</text>
      <circle cx="8" cy="90" r="4" class="red"/><text x="26" y="96" class="num">ABYSSAL DIRECTORATE</text>
      <circle cx="8" cy="122" r="4" fill="#E6E9F2" opacity="0.5"/><text x="26" y="128" class="num">NEUTRAL &#183; RUINED</text>
    </g>
  </g>

  <!-- ======================= FOOTER ======================= -->
  <line x1="130" y1="2486" x2="1870" y2="2486" class="hairline"/>
  <text x="130" y="2572" class="title">THE PELAGION RIFT</text>
  <text x="132" y="2610" class="subtitle">SURVEY CHART &#183; REGIONS &amp; NAMED PLACES</text>
  <text x="132" y="2638" class="meta">SOUNDING 214 PC &#183; COMPILED FROM FOUR ARCHIVES THAT DO NOT SHARE DATA</text>
  <text x="1870" y="2610" class="brand" text-anchor="end">ECHOES OF THE ABYSS</text>
</svg>
