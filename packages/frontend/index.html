    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The standard mobile viewport line. Desktop browsers, the only ones this client
         targets since #1132, ignore it: a trackpad pinch over the canvas arrives as a
         ctrl + wheel event, which EchoRenderer's wheel handler takes. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

  </head>
