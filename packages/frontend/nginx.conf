# Static hosting for the built client. Used by packages/frontend/Dockerfile;
# a platform host (Vercel, per docs/tech-stack.md) applies its own equivalent.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite fingerprints everything it emits under /assets, so those names change
    # whenever their contents do and may be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # The image's nginx.conf leaves gzip off, so the code and the models
        # went out raw (#1038, #1004). The JS and CSS compress about threefold
        # and the models about eightfold; the PNGs and the font are compressed
        # formats already, so no type here names them. Level 6 is zlib's
        # default. Vary keeps a shared cache from handing gzip to a client that
        # did not ask, and `any` keeps a proxy's Via header from turning gzip off.
        gzip on;
        gzip_types application/javascript text/css model/gltf-binary;
        gzip_comp_level 6;
        gzip_vary on;
        gzip_proxied any;

        # The image's mime.types names no `glb`, so the models would go out as
        # application/octet-stream and `gzip_types` would never match them: the
        # type is named here first, and the gzip settings above carry in. A
        # `types` block replaces the inherited map rather than adding to it,
        # which is why it sits in a location that serves nothing else.
        location ~ \.glb$ {
            types { model/gltf-binary glb; }
        }
    }

    # index.html is the one file whose name never changes, so caching it is how
    # a deploy leaves browsers running the previous bundle. The SPA fallback is
    # here too: the client has one entry point, and a refresh on any path should
    # reach it rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
