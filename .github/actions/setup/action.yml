name: Set up Node and dependencies
description: >
  Node 22 with node_modules restored from cache when the lockfile has not changed.
  Shared by every CI job that needs an install, so the install happens once per
  lockfile rather than once per job.

# Two caches, for two different misses.
#
# setup-node's `cache: npm` caches ~/.npm, the tarball store. It makes a cold
# `npm ci` cheaper, but `npm ci` still unpacks ~290 MB and runs every install
# script, which was 50 s of every run — the single largest step after the tests.
#
# The node_modules cache skips that entirely: on a hit there is nothing to
# install. It is keyed on every manifest, not only the lockfile, because a
# package.json edited without its lockfile would otherwise restore a
# node_modules that `npm ci` would have refused to produce.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        # 22+ required: the backend dev/test scripts use `node --import tsx`
        # and the stable node:test runner.
        node-version: '22'
        cache: 'npm'

    - name: Restore node_modules
      id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json') }}

    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
