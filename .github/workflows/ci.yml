name: CI

# Scoped to run **once** per commit rather than twice.
#
# This was `on: [push, pull_request]`, which fires two full runs for every push
# to a branch with an open PR — a `push` run and a `pull_request` run, on the
# same commit, doing identical work. A full run was 15-22 minutes at the time,
# so each push was billing ~40 minutes of Actions time and throwing half of it
# away. That is what exhausted the account's minutes on 2026-08-25, which showed
# up not as a test failure but as jobs completing in three seconds with
# `runner_id: 0` and no logs at all.
#
# That incident is closed: the minutes were restored, this scoping removed the
# duplicate run, and runs have completed normally ever since — four logged jobs
# in about two minutes of wall clock. The symptom is recorded here so it stays
# recognisable, not because it is a live constraint. A red check on a PR is that
# PR's failure; reproduce it locally before calling it anything else.
#
# `push` is therefore limited to main, which keeps every merge verified, and
# branches are covered by their pull request. The trade is real and worth
# naming: a branch pushed *without* a PR now gets no CI until one is opened.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run is wasted money. Force-pushing an amended commit used to
# leave the previous run grinding to completion for another twenty minutes;
# now it is cancelled the moment its replacement starts.
#
# Except on main, where every commit is the record and deserves its own verdict:
# cancelling a merge's run because the next merge landed would leave a commit on
# the default branch that CI never actually checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Models and static checks overlap; both still feed the existing required build
# check. The join job costs another rounded runner minute but avoids silently
# dropping model validation from branch protection when moving it out of build.
# Baseline run 37661465072: 198 s wall clock, 11 rounded Linux job-minutes.
# Compare both measures on warm-cache runs, not just the fastest job.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [checks, models]
    if: always()
    steps:
      - name: Require static checks and model validation
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          MODELS_RESULT: ${{ needs.models.result }}
        run: test "$CHECKS_RESULT" = success && test "$MODELS_RESULT" = success

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      # The root command builds shared before its consumers; no separate build.
      - name: Type-check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      # Scoped to code. Design docs under docs/ are authored prose and are
      # linted by markdownlint below rather than reformatted by Prettier.
      - name: Check formatting
        run: npm run format:check

      # docs/invariants.md names, per row, the test that holds each invariant.
      # This asserts every holder still resolves — file present, test name still
      # in it. A liveness check, not a correctness one: the suites hold the
      # invariants, this holds the list, so a row naming a renamed test fails
      # here instead of quietly describing a suite that moved on.
      - name: Check the invariants list still names live tests
        run: npm run check:invariants

      - name: Build all packages
        run: npm run build

  models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      # All hulls, structures, props, trim sheets and outlines, without filtering.
      # A faction edit must not ship a GLB its script no longer produces.
      - name: Check hull models round-trip
        run: npm run check:models

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Both shards report; a failure in one should not hide the other's.
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: test (shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Build shared package
        run: npm run build:shared

      # Run 37661465072: backend shards 74/57 s, client 65 s, tools 31 s.
      # Put tools with the heavier backend shard and client with the lighter.
      # npm test uses these same groups, including the prose-budget suite.
      - name: Run tool tests
        if: matrix.shard == 1
        run: npm run test:tools

      - name: Run shared and frontend tests
        if: matrix.shard == strategy.job-total
        run: npm run test:client

      # `--test-shard` is node:test's own file-level partition — deterministic,
      # so the same file always lands in the same shard and a failure is
      # reproducible from the shard number alone. Invoked directly rather than
      # through `npm test` because npm's `--` passthrough lands after the file
      # pattern, where node reads it as a second pattern rather than a flag.
      - name: Run backend tests
        working-directory: packages/backend
        run: >
          node --import tsx --test
          --test-shard=${{ matrix.shard }}/${{ strategy.job-total }}
          "test/*.test.ts"

  # --- Documentation checks -------------------------------------------
  # All three doc gates are blocking. #38 fixed the ~270 markdownlint issues
  # and #39 wrote the seven documents that were linked but never
  # authored, so a dead link in docs/ is now a real regression rather
  # than pre-existing content debt.
  #
  # The documentation tools and their transitive dependencies are lockfile-pinned.
  # Reuse the install cache rather than downloading floating npx releases.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Run markdownlint on docs
        run: npm run gates -- --only=docs:lint

      # Config for the link checker lives in .markdown-link-check.json:
      #
      #   * retryOn429 — docs/ROADMAP.md links ~20 GitHub issues, and an
      #     unauthenticated runner gets rate-limited without it.
      #   * this repo's own github.com URLs are ignored. The repo is
      #     private, so unauthenticated requests to its issues and clone URL
      #     return 404 and every one of those links would fail forever.
      #
      # Use the local gate's tracked-file list and empty-list guard too.
      - name: Check markdown links in docs
        run: npm run gates -- --only=docs:links

      # The same two gates over the prose this repository wrote under .claude/,
      # which was outside every glob above until #748 and had already drifted.
      # A script rather than two more shell steps, because it also decides which
      # files are in scope: the eleven vendored skills are upstream copies and
      # stay out, and a skill in neither list fails rather than being skipped.
      - name: Lint and link-check .claude/
        run: npm run docs:claude
