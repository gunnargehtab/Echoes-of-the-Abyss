name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache client node modules
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: ${{ runner.os }}-client-${{ hashFiles('client/package-lock.json', 'client/package.json') }}
          restore-keys: |
            ${{ runner.os }}-client-
      - name: Install client deps (if any)
        run: |
          if [ -f client/package.json ]; then npm --prefix client ci --no-audit --no-fund; fi
      - name: Run client build (if any)
        run: |
          if [ -f client/package.json ]; then npm --prefix client run build; fi
      - name: Install root dependencies
        run: |
          npm ci
      - name: Run ESLint (workspace)
        run: |
          npm run lint
      - name: Run Prettier check
        run: |
          npx prettier --check .
      - name: Run markdownlint on docs
        run: |
          npx -y markdownlint-cli "**/docs/**/*.md" "**/docs/*.md"
      - name: Check markdown links in docs
        run: |
          git ls-files 'docs/**/*.md' | while read -r file; do
            echo "Checking links in $file"
            npx -y markdown-link-check "$file" || exit 1
          done
