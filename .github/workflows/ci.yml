name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install client deps (if any)
        run: |
          if [ -f client/package.json ]; then npm --prefix client ci --no-audit --no-fund || true; fi
      - name: Run client build (if any)
        run: |
          if [ -f client/package.json ]; then npm --prefix client run build || true; fi
      - name: Lint docs (basic)
        run: |
          echo "No linter configured. Add eslint/markdownlint steps as needed."
