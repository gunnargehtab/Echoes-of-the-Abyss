name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22+ required: the backend dev/test scripts use `node --import tsx`
          # and the stable node:test runner.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # packages/shared is compiled ahead of the others because both the
      # frontend and backend import its build output, not its source.
      - name: Build shared package
        run: npm run build:shared

      - name: Type-check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      # Scoped to code. Design docs under docs/ are authored prose and are
      # linted by markdownlint below rather than reformatted by Prettier.
      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build all packages
        run: npm run build

      # --- Documentation checks -------------------------------------------
      # Both doc gates are blocking. #38 fixed the ~270 markdownlint issues
      # and #39 wrote the seven documents that were linked but never
      # authored, so a dead link in docs/ is now a real regression rather
      # than pre-existing content debt.
      #
      # Config for the link checker lives in .markdown-link-check.json:
      #
      #   * retryOn429 — docs/ROADMAP.md links ~20 GitHub issues, and an
      #     unauthenticated runner gets rate-limited without it.
      #   * this repo's own github.com URLs are ignored. The repo is
      #     private, so unauthenticated requests to its issues and clone URL
      #     return 404 and every one of those links would fail forever.
      #
      # The file list needs :(glob) magic. Git pathspecs are fnmatch without
      # FNM_PATHNAME by default, so a bare 'docs/**/*.md' requires a second
      # literal slash and therefore matched NOTHING under docs/ — the link
      # check was silently running over zero files.

      - name: Run markdownlint on docs
        # The previous glob "**/docs/**/*.md" also matched node_modules, so this
        # was linting dependency documentation.
        run: |
          npx -y markdownlint-cli "docs/**/*.md" "docs/*.md" --ignore node_modules

      - name: Check markdown links in docs
        run: |
          git ls-files ':(glob)docs/**/*.md' | while read -r file; do
            echo "Checking links in $file"
            npx -y markdown-link-check --config .markdown-link-check.json "$file" || exit 1
          done
