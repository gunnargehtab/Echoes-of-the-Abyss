# The roadmap site — docs/ROADMAP.md rendered against live issue state.
#
# Publishing is **opt-in and off by default**, which is deliberate. This
# repository is private; a Pages site is not. Merging a workflow should never
# be the thing that decides to make part of a private repository public, so the
# deploy step runs only once someone has knowingly turned it on:
#
#   1. Settings -> Pages -> Source: "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> Variables:
#      add PUBLISH_ROADMAP = true
#
# The variable may live at the repository level or on the `github-pages`
# environment — both work. The check is a *step* inside the deploy job rather
# than a job-level `if`, because environment variables are only visible from
# inside a job that references the environment, and a job-level condition is
# evaluated before that binding exists. The job logs print what the check
# saw, so a skipped deploy says why.
#
# Until the variable is set this workflow builds the site, uploads it as an
# artifact you can download and open locally, and skips the deploy. It stays
# green either way, so an un-enabled Pages setup is not a red X on every push.
name: Roadmap site

on:
  push:
    branches: [main]
    # Only when something that feeds the page changes.
    paths:
      - 'docs/ROADMAP.md'
      - 'tools/roadmap/**'
      - 'packages/frontend/public/favicon.svg'
      - 'packages/frontend/src/assets/fonts/**'
      - '.github/workflows/pages.yml'
  # Issue state is half the page, and it changes without any push at all.
  issues:
    types: [closed, reopened, edited]
  # No `pull_request: closed` trigger, though the merged-PR count is on the
  # page: that event runs the workflow at the PR's own ref, and the
  # github-pages environment only admits main, so its deploy is refused —
  # and on the way it cancels the push run that would have succeeded, since
  # both share the concurrency group. The daily schedule carries the count.
  # A backstop for anything the events above miss.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: roadmap-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step: the generator is dependency-free by design, so the
      # site cannot fail to build because of something in node_modules.
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/roadmap/build.mjs --out dist/roadmap
      - uses: actions/upload-artifact@v4
        with:
          name: roadmap-site
          path: dist/roadmap
      # The Pages artifact is uploaded unconditionally: uploading is not
      # publishing, and the deploy job below is the only thing that is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/roadmap

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is publishing switched on?
        run: |
          echo "PUBLISH_ROADMAP=[${{ vars.PUBLISH_ROADMAP }}]"
          if [ "${{ vars.PUBLISH_ROADMAP }}" = "true" ]; then
            echo "Publishing is on — deploying."
          else
            echo "Publishing is off — set the PUBLISH_ROADMAP variable to true (repository or github-pages environment) to deploy."
          fi
      - id: deploy
        if: vars.PUBLISH_ROADMAP == 'true'
        uses: actions/deploy-pages@v4
