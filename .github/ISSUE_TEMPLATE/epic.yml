name: Epic
description: Track a large body of work spanning multiple issues
labels: [epic, triage]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome does this epic deliver?
    validations:
      required: true

  - type: textarea
    id: subtasks
    attributes:
      label: Sub-issues
      description: Checklist of the issues that make up this epic (link them as they're created).
      placeholder: |
        - [ ] #
        - [ ] #
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related docs, design decisions, or dependencies.
    validations:
      required: false
