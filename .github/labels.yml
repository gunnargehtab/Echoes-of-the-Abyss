# The complete label set for this repository, synced by
# .github/workflows/labels.yml via crazy-max/ghaction-github-labeler.
#
# Edit this file to add/remove/recolor labels — do not edit labels
# directly in the GitHub UI, since the sync workflow will overwrite them.
#
# This file is exhaustive, and the sync deletes any label it does not
# list. That is deliberate: the sync used to run with skip-delete, so a
# label created outside this file lived forever, and GitHub's default
# `documentation` sat alongside `docs` with the same colour and the same
# description until #599 folded it in. **`docs` is the name.** A label
# missing from here is not "unmanaged", it is scheduled for deletion —
# so add one here before it is applied to anything.

# --- Kind: what sort of change an issue asks for ---

- name: bug
  color: d73a4a
  description: Something isn't working

- name: enhancement
  color: a2eeef
  description: New feature or request

- name: docs
  color: 0075ca
  description: Improvements or additions to documentation

- name: infra
  color: 5319e7
  description: Build, CI/CD, tooling, and repository infrastructure

- name: design
  color: ededed
  description: A design call about the game's systems, world, or fiction

# --- Area: which part of the tree the change lands in ---

- name: frontend
  color: bfd4f2
  description: The client — renderer, HUD, screens, and audio

# --- Process: how an issue is tracked ---

- name: epic
  color: 3e4b9e
  description: Large body of work tracked across multiple issues

- name: wontfix
  color: ffffff
  description: This will not be worked on

# --- Routing: addressed to a model or to the unattended Routine ---

# Named fable-5.1 until 26 October, which tied it to a model version rather
# than the work. from_name moves its issues across; it is a no-op once the sync has run.
- name: shape-work
  from_name: fable-5.1
  color: f4a6c8
  description: Shape work, authored under the design model of record (asset-prompts-3d.md rule 3); the backlog Routine skips it

- name: routine
  color: 006b75
  description: Opened by the unattended work-issue Routine

- name: needs-hardware
  color: 9c6b30
  description: Real work that a container cannot do — needs a physical GPU or device

- name: routine-log
  color: 4c5c63
  description: The unattended loop writes here — a ledger, never a work item

- name: finding
  color: a2595f
  description: A defect the loop verified while working something else — ordinary work, open to any firing

- name: needs-decision
  color: 6f42c1
  description: A call a person reserved, or work waiting on the balance freeze — the unattended loop skips it

- name: decision-proposed
  color: b392f0
  description: Options and a recommendation posted; after 24 h with no reply the loop takes the recommendation
  # Small correctness fixes only (work-issue §7), never in place of needs-decision (#1483).

- name: automerge
  color: 0e8a16
  description: A routine pull request that steward merges once CI is green — a person removes it to hold the merge
  # Never on a pull request that changes what the client draws (steward §9, #1483).
