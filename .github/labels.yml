# Standard label set for this repository, synced by
# .github/workflows/labels.yml via crazy-max/ghaction-github-labeler.
#
# Edit this file to add/remove/recolor labels — do not edit labels
# directly in the GitHub UI, since the sync workflow will overwrite them.

- name: bug
  color: d73a4a
  description: Something isn't working

- name: enhancement
  color: a2eeef
  description: New feature or request

- name: docs
  color: 0075ca
  description: Improvements or additions to documentation

- name: infra
  color: 5319e7
  description: Build, CI/CD, tooling, and repository infrastructure

- name: epic
  color: 3e4b9e
  description: Large body of work tracked across multiple issues

- name: triage
  color: fbca04
  description: Needs review to confirm validity, scope, or priority

- name: fable-5.1
  color: f4a6c8
  description: Asset work executed under the design model of record (asset-prompts-3d.md rule 3)

- name: routine
  color: 006b75
  description: Opened by the unattended work-issue Routine

- name: needs-hardware
  color: 9c6b30
  description: Real work that a container cannot do — needs a physical GPU or device

- name: routine-log
  color: 4c5c63
  description: The unattended loop writes here — a ledger, never a work item

- name: needs-decision
  color: 6f42c1
  description: Blocked on a design call a person must make — the unattended loop must not pick a side
